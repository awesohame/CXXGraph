name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  # Use Debug build for better error information and debugging
  BUILD_TYPE: Debug

jobs:
  build:
    # Define the operating systems you want to run the job on
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
  

    steps:
    #- name: Install gtest manually
    #  run: sudo apt-get install libgtest-dev
      
    #- name: Install benchmark manually
    #  run: |
    #      git clone https://github.com/google/benchmark.git
    #      git clone https://github.com/google/googletest.git benchmark/googletest
    #      cd benchmark
    #      cmake -E make_directory "build"
    #      cmake -E chdir "build" cmake -DCMAKE_BUILD_TYPE=Release ../
    #      cmake --build "build" --config Release
    #      sudo cmake --build "build" --config Release --target install

    - uses: actions/checkout@v4

    - name: System Information
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "Runner OS: ${{ runner.os }}"
        uname -a || true
        g++ --version || true
        cmake --version || true
      shell: bash

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      
      # The macro ${{github.workspace}} results in windows file seprators, (\) which CMake often cannot parse. 
      # To get around this use a relative path instead.
      run: |
        if [ ${{ matrix.os }} == 'windows-latest' ]; then
          cmake -DTEST=ON -Dgtest_disable_pthreads=ON -DCMAKE_BUILD_TYPE=Debug -B ./build
        else
          cmake -DTEST=ON -DCMAKE_BUILD_TYPE=Debug -B ${{github.workspace}}/build
        fi;
      shell: bash


    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build/test
      # Execute tests defined by the CMake configuration with verbose output
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --output-on-failure --verbose

    - name: Re-run failed tests with extra verbosity
      if: failure()
      working-directory: ${{github.workspace}}/build/test
      run: ctest --rerun-failed --output-on-failure --verbose

    - name: Run Hopcroft-Karp test directly for debugging
      if: failure()
      working-directory: ${{github.workspace}}/build/test
      run: ./test_exe --gtest_filter="*HopcroftKarp*" --gtest_print_time=1

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.os }}
        path: ${{github.workspace}}/build/test/Testing/Temporary/LastTest.log

